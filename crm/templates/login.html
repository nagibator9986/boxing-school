<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — AINAZAROV TOP TEAM</title>
<link rel="stylesheet" href="{{ url_for('static', filename='crm.css') }}">
</head>
<body>
<div class="login-wrap">
  <form class="card login-card" method="post">
    <div class="brand" style="padding-left:0">AINAZAROV TOP TEAM<small>управление ботом</small></div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password">
      <div class="hint">Тот же, которым открывается управление в Telegram.</div>
    </div>
    <button class="btn primary" type="submit">Войти</button>
  </form>
</div>
</body>
</html>
