- id: safety_kids
  topic: safety
  scope: any
  question_variants:
    ru:
    - не опасно ли
    - по голове бить будут
    - а если нос сломает
    - боюсь за голову
    kk:
    - қауіпті емес пе
    - басқа ұра ма
    - мұрнын сындырса ше
  answer:
    ru: Это нормальный страх, его называет почти каждый родитель. В младших группах основа — общая физподготовка, координация,
      техника и работа на лапах, жёстких спаррингов там нет. Контактная работа появляется позже, в полной защите и под контролем
      тренера. Приходите на пробное и посмотрите тренировку своими глазами.
    kk: Бұл — қалыпты алаңдаушылық, оны кез келген ата-ана айтады. Кіші топтарда негізгісі — дене дайындығы, координация,
      техника және лапамен жұмыс, қатты спарринг жоқ. Контакт кейінірек, толық қорғаныс құралдарымен және жаттықтырушының
      бақылауымен енгізіледі. Сынақ сабаққа келіп, өз көзіңізбен көріңіз.
  source: generic
  gap_ref: null
  escalate_if_empty: false
  requires_tool: null
  forbidden_claims:
  - это абсолютно безопасно
  - травм не бывает
  - мы гарантируем безопасность
  - бокс безопаснее футбола
- id: safety_injuries
  topic: safety
  scope: any
  question_variants:
    ru:
    - травмы бывают
    - часто травмируются
    - а сотрясение
    kk:
    - жарақат ала ма
    - жиі жарақаттана ма
  answer:
    ru: 'Скажу честно: риск есть в любом спорте, и обещать полную безопасность было бы неправдой. Задача тренера — свести
      его к минимуму: постепенная нагрузка, защита, отсутствие жёстких спаррингов у новичков и запрет работать через боль.
      Если у ребёнка есть особенности здоровья, скажите заранее — передам тренеру.'
    kk: 'Шынымды айтайын: кез келген спортта қауіп бар, толық қауіпсіздікке уәде беру дұрыс болмас еді. Жаттықтырушының міндеті
      — оны барынша азайту: біртіндеп жүктеме, қорғаныс құралдары, жаңадан келгендерде қатты спарринг болмауы. Баланың денсаулығында
      ерекшелік болса, алдын ала айтыңыз — жаттықтырушыға жеткіземін.'
  source: generic
  gap_ref: null
  escalate_if_empty: false
  requires_tool: null
  forbidden_claims:
  - травм не бывает
  - это абсолютно безопасно
  - мы гарантируем безопасность
- id: safety_shy_child
  topic: safety
  scope: any
  question_variants:
    ru:
    - ребенок стеснительный
    - он боится
    - он не общительный
    - сын застенчивый
    kk:
    - бала ұялшақ
    - қорқады
    - тартыншақ
  answer:
    ru: 'Таких детей у нас много, обычно это проходит за две-три недели. Новичка не выставляют в центр зала: первые занятия
      он работает в общей разминке или рядом с тренером, драться никто не заставляет. Хотите, запишу на пробное и предупрежу
      тренера, что ребёнок стесняется?'
    kk: 'Ондай балалар көп, әдетте екі-үш аптада үйреніп кетеді. Жаңа бала бірден ортаға шықпайды: алғашқы сабақтарда жалпы
      жаттығуда немесе жаттықтырушының қасында болады, ешкім төбелесуге мәжбүрлемейді. Сынақ сабаққа жазып, жаттықтырушыға
      ескертейін бе?'
