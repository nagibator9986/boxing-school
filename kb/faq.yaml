  topic: trial
  scope: any
  question_variants:
    ru:
    - пробное бесплатное?
    - правда первое занятие бесплатно
    - можно прийти посмотреть
    - бесплатное пробное есть
    kk:
    - сынақ сабақ тегін бе?
    - бірінші сабақ тегін бе
    - келіп көруге бола ма
  answer:
    ru: Да, первое пробное занятие бесплатное и ни к чему не обязывает. Приходите, посмотрите зал и тренера, а решение примете
      после. Записать ребёнка на ближайшее?
    kk: Иә, бірінші сынақ сабақ тегін және ешқандай міндеттеме жоқ. Келіп, залды және жаттықтырушыны көріңіз, шешімді содан
      кейін қабылдайсыз. Балаңызды ең жақын күнге жазайын ба?
  source: owner_confirmed
  gap_ref: null
