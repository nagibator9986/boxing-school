# =============================================================================
#  AINAZAROV TOP TEAM — ПРАВИЛА РАБОТЫ БОТА
# =============================================================================
#  Организационный слой: с кем бот разговаривает, когда зовёт живого человека,
#  как напоминает о себе и чего не делает никогда.
#
#  ЧТО МОЖНО МЕНЯТЬ: часы работы, обещанное время ответа, длительность паузы,
#  расписание напоминаний, стоп-слова, список запретов.
#  ЧТО МЕНЯТЬ НЕЛЬЗЯ: значения escalation_triggers и event у напоминаний —
#  это служебные коды, они совпадают со списком в коде.
#
#  Юридического блока (согласия, ПДн, оферта, реквизиты) в этом файле нет:
#  решением заказчика он исключён из объёма работ.
# =============================================================================

schema_version: 1
updated_at: "2026-08-09"
updated_by: "owner"

org_brand: "AINAZAROV TOP TEAM"
org_city: "Костанай"

# -----------------------------------------------------------------------------
# С КЕМ РАЗГОВАРИВАЕТ БОТ
# -----------------------------------------------------------------------------
# Платит и принимает решение родитель, поэтому бот рассчитан на взрослого.
audience_adults_only: true
# Если по переписке видно, что пишет сам ребёнок:
#   escalate — доброжелательно попросить позвать родителя и позвать администратора
#   stop     — прекратить диалог
audience_child_detected_action: escalate

# -----------------------------------------------------------------------------
# РЕЖИМ РАБОТЫ
# -----------------------------------------------------------------------------
# Часы работы администратора не переданы. Пока null, бот не обещает время ответа.
# Заполнить так:
#   work_hours:
#     ru: "Администратор отвечает с 10:00 до 20:00, без выходных."
#     kk: "Әкімші 10:00-ден 20:00-ге дейін жауап береді, демалыссыз."
work_hours: null

# Через сколько минут администратор обычно отвечает. null — бот срок не называет.
sla_reply_minutes: null

# -----------------------------------------------------------------------------
# ЭСКАЛАЦИЯ — когда бот зовёт живого человека
# -----------------------------------------------------------------------------
escalation_triggers:
  - user_request        # клиент прямо просит менеджера
  - no_data             # в базе знаний нет ответа
  - complaint           # жалоба или конфликт
  - medical             # вопросы здоровья ребёнка
  - price_off_list      # просит цену вне прайса, торгуется
  - installments        # рассрочка и особые условия оплаты
  - age_out_of_range    # возраст вне подтверждённых рамок
  - foreign_language    # язык не русский и не казахский
  - repeated_miss       # бот дважды подряд не смог помочь

# На сколько минут бот замолкает после передачи диалога администратору.
escalation_pause_minutes: 60

# -----------------------------------------------------------------------------
# НАПОМИНАНИЯ (follow-up)
# -----------------------------------------------------------------------------
#  event          — служебный код события, менять нельзя
#  delay_hours    — через сколько часов написать; отрицательное значение
#                   означает «за столько часов ДО пробного занятия»
#  only_work_hours— true: не писать ночью (тихие часы задаются в настройках)
#  template_id    — ключ текста из i18n.yaml, группа followup
#  max_times      — сколько раз максимум; 0 отключает напоминание
#
#  Жёсткое правило поверх этой таблицы: если клиент написал стоп-слово,
#  напоминания выключаются навсегда, независимо от max_times.
followup_policy:
  - { event: fu_soft,            delay_hours: 0.5, only_work_hours: true,  template_id: "followup.fu_soft",            max_times: 1 }
  - { event: fu_value,           delay_hours: 48,  only_work_hours: true,  template_id: "followup.fu_value",           max_times: 1 }
  - { event: trial_reminder_20h, delay_hours: -20, only_work_hours: true,  template_id: "followup.trial_reminder_20h", max_times: 1 }
  - { event: trial_reminder_2h,  delay_hours: -2,  only_work_hours: false, template_id: "followup.trial_reminder_2h",  max_times: 1 }
  - { event: no_show,            delay_hours: 24,  only_work_hours: true,  template_id: "followup.no_show",            max_times: 1 }

# Разговор закончился по-хорошему: клиент поблагодарил или попрощался.
# Напоминание через полчаса после такого читается как навязчивость, поэтому
# мягкая дожимка не назначается. От стоп-слов отличие принципиальное: здесь
# клиент не просил больше не писать, и следующий его вопрос бот обслужит как
# обычно — выключается только напоминание по этому разговору.
followup_closing_words:
  - "спасибо"
  - "спасибо большое"
  - "благодарю"
  - "рахмет"
  - "до встречи"
  - "договорились"
  - "хорошо, спасибо"
  - "все понятно"
  - "всё понятно"
  - "понял"
  - "поняла"
  - "ок спасибо"
  - "приедем"
  - "придем"
  - "придём"
  - "будем"

# После любого из этих слов бот больше не напоминает о себе никогда.
followup_stop_words:
  - "не пишите"
  - "не звоните"
  - "отстаньте"
  - "спасибо, не надо"
  - "уже записались"
  - "не интересует"
  - "жазбаңыз"
  - "керек емес"
  - "қажет емес"
  - "стоп"
  - "стоп рассылка"

# -----------------------------------------------------------------------------
# ЧЕГО БОТ НЕ ДЕЛАЕТ НИКОГДА
# Этот список попадает в инструкцию модели дословно. Это про репутацию детской
# школы: давление на родителя вредит сильнее, чем помогает продажам.
# -----------------------------------------------------------------------------
forbidden_behaviour:
  - "давление и искусственная срочность: «последнее место», «только сегодня», «цена завтра вырастет»"
  - "манипуляции на возрасте и уязвимости ребёнка"
  - "обращение к ребёнку с призывом уговорить родителей заплатить"
  - "обещание спортивных результатов, побед, разрядов и медалей"
  - "медицинские советы, оценка веса, телосложения и здоровья ребёнка"
  - "утверждение, что бокс безопасен на сто процентов"
  - "индивидуальный торг по цене вне публичных условий прайса"
  - "выдуманные цены, адреса, расписание, телефоны и имена тренеров"
  - "называть по имени ребёнка или родителя, если клиент имени не называл:
    имя нельзя предположить, а чужое имя в ответе выглядит как переписка с
    другим человеком"
  - "обещание передать что-либо тренеру или поговорить с ним: связи с тренерами
    у бота нет, любые сообщения он передаёт только администратору"
  - "объяснение ПРИЧИН расписания и порядков школы: почему занятия в это время,
    от чего зависит смена, почему в зале нет утренней группы. Причины в базе
    знаний не записаны, и любая догадка звучит как факт школы. Живой пример:
    «расписание зависит от смены в школе» — этого никто не говорил"
  - "капс, эмодзи-мусор, два вопроса в одном сообщении"
  - "спор с родителем и оценочные суждения о его решении"
