# =============================================================================
#  AINAZAROV TOP TEAM — ТАРИФЫ И СКИДКИ
# =============================================================================
#  Этот файл питает КАЛЬКУЛЯТОР. Модель (ИИ) сама цены не считает и не называет:
#  она обязана вызвать инструмент, который считает по этим числам. Поэтому
#  ошибка в цифре здесь — это ошибка во всех ответах бота сразу.
#
#  ГЛАВНОЕ ПРАВИЛО ГЕОГРАФИИ:
#    Костанай  → городской прайс (25 000 / 30 000 / 3 200 ₸)
#    райцентр  → районный прайс (10 000 ₸, семейный 8 000 ₸ за ребёнка)
#  Одно и то же слово «абонемент» отличается в 2,5 раза, поэтому бот сначала
#  выясняет город или посёлок и только потом называет сумму.
#
#  ЧТО МОЖНО МЕНЯТЬ: любые цены (целое число тенге, без пробелов и знака ₸),
#  тексты label и note, состав payment_methods, freeze_policy.
#  ЧТО МЕНЯТЬ НЕЛЬЗЯ: имена тарифов standard / flexible — на них завязан код.
#
#  ПУСТОЕ ПОЛЕ: null или []. Пустые кавычки "" — ошибка загрузки.
#  Тариф со значением null означает «такого тарифа нет / нет данных», и бот
#  честно говорит «уточню у администратора» вместо выдуманной цены.
# =============================================================================

schema_version: 1
updated_at: "2026-08-09"
updated_by: "owner"

currency: "KZT"                 # только тенге
rounding_mode: half_up          # округление итога: half_up | floor | none
rounding_to: 10                 # шаг округления, тенге

# -----------------------------------------------------------------------------
# КОСТАНАЙ
# -----------------------------------------------------------------------------
city_settlement: "Костанай"
city_sessions: 12               # занятий в абонементе
city_validity_days: 30          # «абонемент действует в течение месяца»
city_validity_note:
  ru: "Абонемент — 12 занятий, действует в течение месяца."
  kk: "Абонемент — 12 сабақ, бір ай ішінде жарамды."

city_plans:
  standard:
    price: 25000
    recalculation: false
    label: { ru: "Стандартный", kk: "Стандартты" }
    # Эту оговорку бот обязан произносить ДО продажи, а не после (конфликт C-6).
    note:
      ru: "Перерасчёта и возврата за пропущенные тренировки нет."
      kk: "Жіберілген жаттығулар үшін қайта есептеу және қайтару жоқ."
  flexible:
    price: 30000
    recalculation: true
    label: { ru: "Гибкий", kk: "Икемді" }
    note:
      ru: "С перерасчётом за пропущенные тренировки."
      kk: "Жіберілген жаттығулар қайта есептеледі."

city_single:
  price: 3200
  recalculation: false
  label: { ru: "Разовая тренировка", kk: "Бір реттік жаттығу" }
  note: null

# --- Семейная скидка города --------------------------------------------------
#  По прайсу: 10 % на второго ребёнка, 15 % на третьего.
#
#  КОНФЛИКТ C-4 — ФЛАГ, А НЕ ЖЁСТКОЕ ПРАВИЛО.
#  На фото прайса сноска про скидку стоит под всей таблицей, то есть формально
#  относится к обоим тарифам. Пока владелец не подтвердил это письменно,
#  applies_to_status: unconfirmed — бот считает по обоим тарифам, НО обязан
#  добавить оговорку «точную скидку по гибкому тарифу подтвердит администратор».
#  Владелец подтвердил → поставить confirmed, оговорка исчезнет сама.
#  Скидка только на стандартный → убрать "flexible" из applies_to.
#
#  КОНФЛИКТ C-5: от какого тарифа считается «второй ребёнок», если дети
#  на разных тарифах. Пока base_rule_status: unconfirmed, при разных тарифах
#  бот не считает и передаёт вопрос администратору.
city_family_discount:
  type: percent_by_order        # percent_by_order — проценты по порядку зачисления
  rules:
    - { child_index: 2, percent: 10 }
    - { child_index: 3, percent: 15 }
  applies_to: ["standard", "flexible"]
  applies_to_status: unconfirmed        # C-4  ← сменить на confirmed после ответа владельца
  base_rule: enrollment_order           # enrollment_order | cheapest_first
  base_rule_status: unconfirmed         # C-5
  max_children: 3                       # на четвёртого ребёнка правила нет → администратор
  label:
    ru: "Скидка для детей из одной семьи: 10% на второго ребёнка, 15% на третьего."
    kk: "Бір отбасының балаларына жеңілдік: екінші балаға 10%, үшіншісіне 15%."

# -----------------------------------------------------------------------------
# РАЙЦЕНТРЫ ОБЛАСТИ
# Механика скидки здесь ДРУГАЯ: не процент, а фиксированная цена за ребёнка.
# -----------------------------------------------------------------------------
# Тобыл добавлен 12.08.2026 из расписания владельца.
# ТРЕБУЕТ ПОДТВЕРЖДЕНИЯ: Тобыл считается райцентром (10 000 тг) или городом (25 000 тг)?
region_settlements: ["Карабалык", "Фёдоровка", "Сарыколь", "Аулиеколь", "Узынколь", "Житикара", "Тобыл"]

region_plans:
  standard:
    price: 10000
    recalculation: false
    label: { ru: "Стандартный", kk: "Стандартты" }
    note: { ru: "Без перерасчёта за пропуски.", kk: "Жіберілген сабақтар қайта есептелмейді." }
  # G-10: есть ли в райцентрах гибкий тариф — НЕИЗВЕСТНО. Пока null, бот отвечает
  # «уточню у администратора». Появится тариф — заполнить по образцу standard.
  flexible: null

region_single: null             # G-10: разовые тренировки в райцентрах — нет данных

# Семейный тариф райцентров: ФИКСИРОВАННАЯ цена за каждого ребёнка при двух и
# более детях из одной семьи. Это НЕ процент — не путать с городской скидкой.
region_family_price_per_child: 8000
region_family_min_children: 2
region_family_label:
  ru: "Семейный тариф: 8 000 ₸ за каждого ребёнка, если занимаются двое и более детей из одной семьи."
  kk: "Отбасылық тариф: бір отбасынан екі және одан көп бала болса, әр балаға 8 000 ₸."

# -----------------------------------------------------------------------------
# ПРОИЗВОДНЫЕ АРГУМЕНТЫ
# Числа ниже — следствие цен выше. Если меняете цены, пересчитайте и эти строки,
# иначе бот будет приводить устаревшую арифметику.
# derived_enabled: false — бот перестанет их произносить, цены останутся.
# -----------------------------------------------------------------------------
derived_enabled: true
derived_facts:
  - id: subscription_vs_single
    ru: "12 разовых тренировок стоили бы 38 400 ₸, абонемент — 25 000 ₸: экономия 13 400 ₸."
    kk: "12 бір реттік жаттығу 38 400 ₸ болар еді, абонемент — 25 000 ₸: 13 400 ₸ үнемдейсіз."
  - id: price_per_session
    ru: "По абонементу одно занятие выходит примерно 2 083 ₸ вместо 3 200 ₸ разово."
    kk: "Абонемент бойынша бір сабақ шамамен 2 083 ₸, бір реттік — 3 200 ₸."
  - id: flexible_break_even
    ru: "Гибкий тариф дороже на 5 000 ₸ — он оправдан, если ребёнок регулярно пропускает две и больше тренировки в месяц."
    kk: "Икемді тариф 5 000 ₸ қымбат — бала айына екі және одан көп сабақ жіберсе, тиімді болады."

# -----------------------------------------------------------------------------
# ОПЛАТА И ЗАМОРОЗКА
# -----------------------------------------------------------------------------
# G-9: способы оплаты не переданы. Пока список пуст, бот не называет ни Kaspi,
# ни наличные, ни рассрочку — только передаёт вопрос администратору.
# Заполнить так:  payment_methods: ["Kaspi QR", "перевод на карту", "наличные"]
payment_methods: []

# G-9: реквизиты для оплаты. Пока null — артефакт payment_details выключен.
payment_details: null

# G-13: политика заморозки абонемента при болезни или отпуске. Нет данных.
# Заполнить так:  freeze_policy: { ru: "текст", kk: "мәтін" }
freeze_policy: null
