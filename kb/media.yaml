- id: payment_rules
  kind: text_card
  enabled: true
  scope: city
  gym_id: null
  title:
    ru: Правила оплаты абонемента
    kk: Абонемент төлеу ережелері
  when_to_send_ru: когда спрашивают про сроки оплаты, перенос пропущенных занятий или разницу между тарифами
  body:
    ru: 'Правила оплаты абонемента


      Оплата — ежемесячно, до 10-го числа. Абонемент действует в рамках одного календарного месяца, с 1-го по последнее число.

      Неиспользованные тренировки на следующий месяц не переносятся.


      25 000 ₸ — без перерасчёта

      Пропущенные тренировки не переносятся и не компенсируются. Остаток занятий на следующий месяц не сохраняется.


      30 000 ₸ — с перерасчётом

      Перерасчёт возможен, если о пропуске предупредить тренера или администратора заранее: болезнь, справка, отпуск и другие
      согласованные причины. Без предупреждения перерасчёт не делается.


      Просим вносить оплату вовремя и заранее сообщать о длительном отсутствии.'
    kk: 'Абонемент төлеу ережелері


      Төлем — ай сайын, әр айдың 10-ына дейін. Абонемент бір күнтізбелік ай ішінде жарамды: айдың 1-інен соңғы күніне дейін.

      Пайдаланылмаған жаттығулар келесі айға ауыспайды.


      25 000 ₸ — қайта есептеусіз

      Жіберілген жаттығулар ауыспайды және өтелмейді. Қалған сабақтар келесі айға сақталмайды.


      30 000 ₸ — қайта есептеумен

      Жіберу туралы жаттықтырушыға немесе әкімшіге алдын ала хабарласаңыз, қайта есептеу мүмкін: ауру, анықтама, демалыс және
      басқа келісілген себептер. Ескертусіз қайта есептеу жасалмайды.


      Төлемді уақытында жасауды және ұзақ болмау туралы алдын ала хабарлауды сұраймыз.'
  file_path: null
  file_mime: null
  file_bytes: null
  file_sha256: null
