# =============================================================================
#  AINAZAROV TOP TEAM — СИСТЕМНЫЕ ФРАЗЫ БОТА
# =============================================================================
#  Это то, что бот говорит БЕЗ участия модели: приветствие, честное «этих данных
#  у меня нет», передача администратору, сообщения об ошибках, напоминания,
#  карточки для администратора, прощание. Такие формулировки обязаны быть
#  одинаковыми от диалога к диалогу, поэтому они и вынесены сюда.
#
#  ПРАВИЛА ПРАВКИ:
#    * у каждого ключа обязаны быть ОБЕ локали: ru и kk;
#    * фигурные скобки {вот_так} — это подстановки, их набор в ru и kk обязан
#      совпадать. Написали {gym} только в русской строке — база не загрузится;
#    * без эмодзи, без markdown, до 900 знаков;
#    * ключи менять нельзя: на них ссылается код. Менять можно только тексты.
#
#  Тон: спокойный, на «вы» / «сіз», без давления. Если данных нет — сказать это
#  прямо и предложить один конкретный шаг, а не извиняться в три предложения.
# =============================================================================

schema_version: 1
updated_at: "2026-09-01"
updated_by: "admin"

strings:

  # ---------------------------------------------------------------------------
  # ПРИВЕТСТВИЯ
  # ---------------------------------------------------------------------------
  # Первое сообщение обязано подсказывать, что писать дальше. Владелец: «я
  # растерялся изначально, что нужно написать после первого сообщения бота».
  # Поэтому не «что вас интересует?», а три понятных варианта — включая ветку
  # для тех, кто уже занимается: им нужна не продажа, а решение вопроса.
  greeting.first:
    ru: |-
      Здравствуйте! Это школа бокса и кикбоксинга AINAZAROV TOP TEAM.

      Подскажите, что вам ближе:
      1. Записаться на бесплатное пробное занятие
      2. Узнать подробнее о школе, ценах и залах
      3. Мы уже занимаемся — вопрос по оплате, расписанию или группе
      4. Написать менеджеру

      Напишите цифру или своими словами.
    kk: |-
      Сәлеметсіз бе! Бұл AINAZAROV TOP TEAM бокс және кикбоксинг мектебі.

      Айтыңызшы, сізге не жақын:
      1. Тегін сынақ сабағына жазылу
      2. Мектеп, бағалар және залдар туралы толығырақ білу
      3. Біз қазірдің өзінде айналысамыз — төлем, кесте немесе топ бойынша сұрақ
      4. Менеджерге жазу

      Санын жазыңыз немесе өз сөзіңізбен айтыңыз.
  greeting.salam:
    ru: "Сәлеметсіз бе! Это школа бокса и кикбоксинга AINAZAROV TOP TEAM. Могу ответить по-казахски или по-русски — как вам удобнее?"
    kk: "Сәлеметсіз бе! Бұл — AINAZAROV TOP TEAM бокс және кикбоксинг мектебі. Қазақша да, орысша да жауап бере аламын — қалай ыңғайлы?"
  greeting.returning:
    ru: "Здравствуйте! Рад снова вас слышать. Чем помочь на этот раз?"
    kk: "Сәлеметсіз бе! Қайта хабарласқаныңыз жақсы болды. Бұл жолы немен көмектесейін?"

  # ---------------------------------------------------------------------------
  # ЧЕСТНЫЕ ЗАГЛУШКИ: данных в базе нет
  # Это самые важные строки бота. Пока владелец не дозаполнил базу, именно они
  # спасают от выдуманных ответов. Не заменяйте их на «я не знаю».
  # ---------------------------------------------------------------------------
  gap.schedule:
    ru: "Точное расписание по этому залу подскажет администратор — угадывать не буду. Передать ему ваш вопрос?"
    kk: "Бұл залдың нақты кестесін әкімші айтады — мен болжамаймын. Сұрағыңызды оған жеткізейін бе?"
  gap.contacts:
    ru: "Номер администратора я пока дать не могу. Напишите здесь — передам ваш вопрос, он ответит в этой же переписке."
    kk: "Әкімшінің нөмірін әзірге бере алмаймын. Осында жазыңыз — сұрағыңызды жеткіземін, ол осы хат алмасуда жауап береді."
  gap.region_address:
    ru: "Секция в этом райцентре есть, а точный адрес подскажет администратор — передам ему ваш вопрос."
    kk: "Бұл аудан орталығында секция бар, ал нақты мекенжайды әкімші айтады — сұрағыңызды оған жеткіземін."
  gap.trial_conditions:
    ru: "Условия бесплатного пробного уточнит администратор — не хочу сказать неточность. Записать ребёнка, чтобы он связался и всё подтвердил?"
    kk: "Тегін сынақ сабақтың шарттарын әкімші нақтылайды — қате айтқым келмейді. Балаңызды жазып қояйын ба, ол хабарласып, бәрін растайды?"
  gap.docs:
    ru: "Про справку скажет администратор. Конкретную форму называть не буду, чтобы вы не съездили в поликлинику зря."
    kk: "Анықтама туралы әкімші айтады. Емханаға бекер бармауыңыз үшін нақты форманы атамаймын."
  gap.gear:
    ru: "Что именно взять на тренировку, уточнит администратор. Обычно это спрашивают вместе с расписанием — передам оба вопроса."
    kk: "Жаттығуға нақты не алу керектігін әкімші нақтылайды. Әдетте мұны кестемен бірге сұрайды — екі сұрақты да жеткіземін."
  gap.payment:
    ru: "Способы оплаты подтвердит администратор. Стоимость назвать могу — посчитать точную сумму под ваш случай?"
    kk: "Төлем тәсілдерін әкімші растайды. Құнын айта аламын — жағдайыңызға нақты соманы есептеп берейін бе?"
  gap.coaches:
    ru: "Про тренера конкретного зала расскажет администратор. Передам ему ваш вопрос."
    kk: "Нақты залдың жаттықтырушысы туралы әкімші айтады. Сұрағыңызды оған жеткіземін."
  gap.kzhbi:
    ru: "По КЖБИ я уточню у администратора и гадать не стану. Скажите, где вам удобнее — подберу ближайший из тех залов, что точно работают."
    kk: "КЖБИ бойынша әкімшіден нақтылаймын, болжамаймын. Сізге қай жер ыңғайлы екенін айтыңыз — нақты жұмыс істейтін залдардың ішінен жақынын таңдап беремін."
  gap.age_limits:
    ru: "Про верхнюю границу возраста и отдельные группы точно ответит администратор. Скажите возраст — передам вопрос вместе с ним."
    kk: "Жас шегі мен жеке топтар туралы нақты жауапты әкімші береді. Жасын айтыңыз — сұрақты сонымен бірге жеткіземін."
  gap.region_plans:
    ru: "По райцентрам у меня подтверждён только абонемент. Про другие варианты уточнит администратор — передать ему вопрос?"
    kk: "Аудан орталықтары бойынша менде тек абонемент расталған. Басқа нұсқаларды әкімші нақтылайды — сұрағыңызды жеткізейін бе?"
  gap.enrollment:
    ru: "Есть ли сейчас свободные места, точно скажет администратор. Могу записать ребёнка на пробное — он подтвердит время."
    kk: "Қазір бос орын бар-жоғын әкімші нақты айтады. Балаңызды сынақ сабаққа жазып қоя аламын — уақытын ол растайды."
  gap.results:
    ru: "Про соревнования и достижения учеников расскажет администратор — сам придумывать не буду. Передать ему вопрос?"
    kk: "Жарыстар мен шәкірттердің жетістіктері туралы әкімші айтады — өзімнен ойлап шығармаймын. Сұрағыңызды жеткізейін бе?"
  gap.freeze:
    ru: "Что будет с абонементом при болезни или отъезде, подтвердит администратор. Передам ваш вопрос ему."
    kk: "Ауырып қалғанда немесе кетіп қалғанда абонемент қалай болатынын әкімші растайды. Сұрағыңызды оған жеткіземін."
  gap.group_size:
    ru: "Сколько детей в группе, точно скажет администратор — цифру наугад не назову. Передать ему ваш вопрос?"
    kk: "Топта неше бала болатынын әкімші нақты айтады — санды кездейсоқ атамаймын. Сұрағыңызды оған жеткізейін бе?"
  gap.documents:
    ru: "Про договор и условия ответит администратор. Передам ваш вопрос ему."
    kk: "Шарт пен талаптар туралы әкімші жауап береді. Сұрағыңызды оған жеткіземін."
  gap.location:
    ru: "Геометки этого зала у меня пока нет, но есть адрес и ориентир — их и пришлю. Прислать?"
    kk: "Бұл залдың геобелгісі әзірге жоқ, бірақ мекенжайы мен бағдары бар — соны жіберемін. Жіберейін бе?"
  gap.generic:
    ru: "Этих данных у меня пока нет, а угадывать не буду. Передам ваш вопрос администратору — он ответит в этой же переписке."
    kk: "Бұл дерек менде әзірге жоқ, болжағым келмейді. Сұрағыңызды әкімшіге жеткіземін — ол осы хат алмасуда жауап береді."

  # ---------------------------------------------------------------------------
  # ПЕРЕДАЧА ЖИВОМУ ЧЕЛОВЕКУ
  # ---------------------------------------------------------------------------
  escalation.handoff:
    ru: "Здесь лучше ответит администратор, чтобы не сказать вам неточность. Передаю ваш вопрос — он напишет сюда же."
    kk: "Мұнда әкімші жақсырақ жауап береді, қате айтпау үшін. Сұрағыңызды жеткізіп жатырмын — ол осында жазады."
  escalation.done:
    ru: "Передал администратору. Он ответит в этой переписке, отдельно писать никуда не нужно."
    kk: "Әкімшіге жеткіздім. Ол осы хат алмасуда жауап береді, бөлек ешқайда жазудың қажеті жоқ."
  escalation.child_writing:
    ru: "Классно, что хочешь заниматься. Для записи нужно согласие родителей — покажи это сообщение маме или папе, пусть напишут сюда."
    kk: "Айналысқың келгені жақсы. Жазылу үшін ата-ананың келісімі керек — осы хабарламаны анаңа немесе әкеңе көрсет, олар осында жазсын."
  escalation.medical:
    ru: "Про здоровье ребёнка я советовать не имею права. Передам вопрос администратору, а по самочувствию лучше поговорить с врачом."
    kk: "Баланың денсаулығы туралы кеңес беруге құқығым жоқ. Сұрақты әкімшіге жеткіземін, ал денсаулық жөнінде дәрігермен сөйлескен дұрыс."
  escalation.complaint:
    ru: "Понимаю, что ситуация неприятная. Передаю ваше сообщение администратору, он разберётся и ответит здесь же."
    kk: "Жағдайдың жағымсыз екенін түсінемін. Хабарламаңызды әкімшіге жеткізіп жатырмын, ол қарап шығып, осында жауап береді."
  escalation.foreign_language:
    ru: "I will pass your message to our administrator, he will answer here. Мы отвечаем на русском и казахском."
    kk: "I will pass your message to our administrator, he will answer here. Біз орысша және қазақша жауап береміз."

  # ---------------------------------------------------------------------------
  # ОШИБКИ И ТЕХНИЧЕСКИЕ СИТУАЦИИ
  # ---------------------------------------------------------------------------
  error.generic:
    ru: "Секунду, у меня сбой на стороне сервиса. Передаю администратору, он ответит здесь же."
    kk: "Бір сәт, сервис жағында ақау шықты. Әкімшіге жеткізіп жатырмын, ол осында жауап береді."
  error.voice_message:
    ru: "Голосовые я пока не слушаю. Напишите, пожалуйста, текстом — отвечу сразу."
    kk: "Дауыстық хабарламаны әзірге тыңдамаймын. Мәтінмен жазыңызшы — бірден жауап беремін."
  error.unsupported_media:
    ru: "Этот файл я открыть не могу. Опишите вопрос текстом или дождитесь администратора — он посмотрит вложение."
    kk: "Бұл файлды аша алмаймын. Сұрағыңызды мәтінмен жазыңыз немесе әкімшіні күтіңіз — ол тіркемені қарайды."
  error.too_many_messages:
    ru: "Вижу несколько сообщений подряд — отвечу на всё по порядку."
    kk: "Қатарынан бірнеше хабарлама көрдім — бәріне ретімен жауап беремін."
  error.rate_limit:
    ru: "Слишком много сообщений подряд, я не успеваю. Напишите одним сообщением, что нужно — отвечу."
    kk: "Хабарлама тым көп, үлгермей жатырмын. Не қажет екенін бір хабарламамен жазыңыз — жауап беремін."

  # ---------------------------------------------------------------------------
  # ЯЗЫКОВОЙ МОСТИК
  # ---------------------------------------------------------------------------
  bridge.kk_offer:
    ru: "Қазақша жазсаңыз, қазақша жауап беремін."
    kk: "Қазақша жазсаңыз, қазақша жауап беремін."
  bridge.ru_offer:
    ru: "Если удобнее по-русски — пишите по-русски, отвечу так же."
    kk: "Орысша ыңғайлы болса — орысша жазыңыз, солай жауап беремін."

  # ---------------------------------------------------------------------------
  # НАПОМИНАНИЯ. Их видит клиент. Тон мягкий, без давления, один шаг в конце.
  # ---------------------------------------------------------------------------
  followup.fu_soft:
    ru: "Добрый день. Остались вопросы по секции? Если удобно — могу сразу записать на бесплатное пробное."
    kk: "Қайырлы күн. Секция бойынша сұрақтар қалды ма? Ыңғайлы болса — тегін сынақ сабаққа бірден жазып қоямын."
  followup.fu_value:
    ru: "Добрый день. Если ещё актуально, запишу ребёнка на бесплатное пробное, время подтвердит администратор. Если нет — больше не пишу."
    kk: "Қайырлы күн. Әлі өзекті болса, балаңызды тегін сынақ сабаққа жазамын, уақытын әкімші растайды. Жоқ болса — енді жазбаймын."
  followup.trial_reminder_20h:
    ru: "Напоминаю про пробное занятие для {child} завтра. Если планы изменились, просто напишите — перенесём."
    kk: "{child} үшін ертеңгі сынақ сабақты еске саламын. Жоспарыңыз өзгерсе, жай ғана жазыңыз — ауыстырамыз."
  followup.trial_reminder_2h:
    ru: "Пробное занятие для {child} уже сегодня. Адрес: {gym}. Если не получается прийти, напишите — перенесём."
    kk: "{child} үшін сынақ сабақ бүгін. Мекенжайы: {gym}. Келе алмасаңыз, жазыңыз — ауыстырамыз."
  followup.no_show:
    ru: "Вчера вас не было на пробном — бывает. Хотите, подберём другое время?"
    kk: "Кеше сынақ сабаққа келмедіңіздер — бәрі болады. Қаласаңыз, басқа уақыт таңдайық па?"

  # ---------------------------------------------------------------------------
  # КАРТОЧКИ ДЛЯ АДМИНИСТРАТОРА
  # Их читает сотрудник школы, поэтому текст одинаковый на обоих языках,
