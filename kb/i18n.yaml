  # ---------------------------------------------------------------------------
  lead_card.trial_booked:
    ru: "НОВАЯ ЗАПИСЬ НА ПРОБНОЕ\n\nРебёнок: {child}\nРодитель: {parent}\nТелефон: {phone}\nЯзык: {lang}\nЗал: {gym}\nКогда: {when}\nМотив: {motivation}\nТревога родителя: {objection}\nКанал: {channel}, диалог от {dt}"
    kk: "НОВАЯ ЗАПИСЬ НА ПРОБНОЕ\n\nРебёнок: {child}\nРодитель: {parent}\nТелефон: {phone}\nЯзык: {lang}\nЗал: {gym}\nКогда: {when}\nМотив: {motivation}\nТревога родителя: {objection}\nКанал: {channel}, диалог от {dt}"
  lead_card.escalation:
    ru: "НУЖЕН ЖИВОЙ ОТВЕТ\n\nТелефон: {phone}\nВопрос: {question}\nЯзык: {lang}\nПричина: {reason}\nКанал: {channel}, {dt}"
    kk: "НУЖЕН ЖИВОЙ ОТВЕТ\n\nТелефон: {phone}\nВопрос: {question}\nЯзык: {lang}\nПричина: {reason}\nКанал: {channel}, {dt}"
  lead_card.thinking:
    ru: "ЛИД ДУМАЕТ\n\nРебёнок: {child}\nТелефон: {phone}\nЯзык: {lang}\nРайон: {district}\nВозражение: {objection}\nКанал: {channel}, {dt}"
    kk: "ЛИД ДУМАЕТ\n\nРебёнок: {child}\nТелефон: {phone}\nЯзык: {lang}\nРайон: {district}\nВозражение: {objection}\nКанал: {channel}, {dt}"
  lead_card.alert:
    ru: "ТЕХНИЧЕСКАЯ ТРЕВОГА\n\nЧто случилось: {what}\nКогда: {dt}\nПодробности: {details}"
    kk: "ТЕХНИЧЕСКАЯ ТРЕВОГА\n\nЧто случилось: {what}\nКогда: {dt}\nПодробности: {details}"

  # ---------------------------------------------------------------------------
  # СЛУЖЕБНЫЕ ПОДТВЕРЖДЕНИЯ КЛИЕНТУ
