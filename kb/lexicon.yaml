# -----------------------------------------------------------------------------
# ОПРЕДЕЛЕНИЕ ЯЗЫКА
# -----------------------------------------------------------------------------
# Специфические казахские буквы: одна такая буква — сильный признак казахского.
kk_graphemes: ["ә", "ғ", "қ", "ң", "ө", "ұ", "ү", "һ", "і"]

# Частые казахские слова без специфических букв.
kk_words:
- "қанша"
- "канша"
- "баға"
- "сабақ"
- "сабак"
- "бала"
- "балам"
- "жазыңыз"
- "кесте"
- "мекенжай"
- "жас"
- "тегін"
- "керек"
- "рахмет"
- "сәлеметсіз"
- "салеметсиз"
- "иә"
- "жоқ"

# Казахский латиницей и «как слышится» — часто пишут именно так.
kk_translit:
- "salemetsiz"
- "salem"
- "kalai"
- "kalay"
- "balam"
- "jaste"
- "kansha"
- "rahmet"
- "kerek"
- "bala"

# Русский латиницей — не должен приниматься за казахский.
