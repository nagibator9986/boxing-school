# -----------------------------------------------------------------------------
# ВОЗРАСТ РЕБЁНКА В СВОБОДНОМ ТЕКСТЕ
# Это регулярные выражения. Менять только если понимаете синтаксис.
# -----------------------------------------------------------------------------
age_patterns:
- "(\\d{1,2})\\s*(лет|года|годика|год|л\\.?|жаста|жас)"
- "(сыну|сыну уже|дочке|дочери|ребенку|ребёнку|ұлым|қызым|балама)\\s*(\\d{1,2})"
- "(\\d{4})\\s*(года рождения|г\\.?р\\.?|жылы)"

# -----------------------------------------------------------------------------
# ПОЛ РЕБЁНКА
# -----------------------------------------------------------------------------
gender_markers:
  m: ["сын", "сына", "сыну", "мальчик", "мальчика", "пацан", "ұл", "ұлым", "балам ер"]
  f: ["дочь", "дочка", "дочке", "дочери", "девочка", "девочку", "қыз", "қызым"]

# -----------------------------------------------------------------------------
# РАЙОНЫ, ГДЕ ЗАЛА НЕТ
# Клиенты их называют. Бот обязан понять район и честно предложить ближайший зал,
# а не переспрашивать по кругу. Если в районе откроется зал — переносите название
# в gyms.yaml, в district_aliases нужного зала, и убирайте отсюда.
# -----------------------------------------------------------------------------
