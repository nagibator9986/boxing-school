# =============================================================================
#  AINAZAROV TOP TEAM — РАЗГОВОРНЫЙ СЛОВАРЬ
# =============================================================================
#  Живая речь костанайских родителей: сокращения, опечатки, транслит, названия
#  районов «как говорят», а не «как в документах». Этот файл работает ДО модели:
#  по нему бот понимает, о чём вопрос, даже если написано «скок стоит абик».
#
#  Это единственный файл, который правит скорее разработчик, чем владелец.
#  Но добавлять слова сюда безопасно: список только помогает распознать тему.
#
#  ПРАВИЛА:
#    * всё в нижнем регистре, иначе база не загрузится;
#    * без знаков препинания в конце слова;
#    * названия районов, где есть зал, живут в gyms.yaml (district_aliases);
#      здесь, в districts_extra, — районы, где зала НЕТ: они нужны, чтобы бот
#      понял вопрос и честно предложил ближайший зал, а не переспрашивал.
# =============================================================================

schema_version: 1
updated_at: "2026-09-01"
updated_by: "admin"

