  client_matter:
  # Вопросы действующих клиентов. Бот на них не отвечает — решает человек.
  # Слова подобраны так, чтобы не задеть тех, кто только выбирает секцию:
  # «нужна ли справка» и «а есть другое время» — это ещё разговор о записи.
  # пропуск занятия
  - "не сможет прийти"
  - "не сможем прийти"
  - "не сможет подойти"
  - "не сможем подойти"
  # Порядок слов в русском свободный: «Артем завтра прийти не сможет» — живой
  # пример владельца, и на фразу «не сможет прийти» он не похож ни одной буквой.
