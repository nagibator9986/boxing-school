; Конфигурация Alembic для AINAZAROV TOP TEAM.
;
; URL подключения здесь НЕ хранится: его отдаёт app/config.py (get_settings().database_url),
; потому что на Railway он приходит переменной окружения DATABASE_URL и нормализуется в коде.
; Для разовых прогонов URL можно передать явно:
;     alembic -x db_url=sqlite+aiosqlite:///./data/bot.db upgrade head
;
; Драйвера psycopg2 в зависимостях нет — migrations/env.py работает на async-движке.

[alembic]
; %(here)s — каталог этого файла, поэтому alembic находит миграции из любой рабочей директории.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

; Имя файла ревизии: 0001_initial.py, 0002_....py — порядок читается глазами.
file_template = %%(rev)s_%%(slug)s

; Пусто намеренно: см. комментарий выше.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
